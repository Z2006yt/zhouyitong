<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象</title>
    <!--类 实例就是对象，两个要素 属性和方法
    学生的属性：姓名、年龄、性别、班级、学号
    方法：学习、吃饭、睡觉、看电影、玩游戏 -->
</head>
<body>
    <script>
        //对象的创建
        var student = {
            name: "张三",
            age: 18,
            gender: "男",
            class: "高三一班",
            studentId: "2023001",
            hobby: ["打篮球","踢足球", "游泳"],
            study: function() {
                console.log(this.name + "正在学习");
            },
            eat: function() {
                console.log(this.name + "正在吃饭");
            },
            sleep: function() {
                console.log(this.name + "正在睡觉");
            },
            watchMovie: function() {
                console.log(this.name + "正在看电影");
            },
            playGame: function() {
                console.log(this.name + "正在玩游戏");
            }
        };
         console.log(student.name);
         console.log(student.study());
         // 删除对象方法
         delete student.watchMovie;
         // 判断对象中是否有某个属性或者方法
         console.log("watchMovie" in student);
         // 对象的遍历
         for (var key in student) {
             console.log(key, student[key]);
          }
          //对象赋值实质是复制了引用地址，相当于起别名，多个变量可以指向同一个对象
          var o=student;
          console.log(o.name);
          o.name="李四";
          //对象的引用类型考察（引用的是地址）
          console.log('o的名字' + o.name);
          console.log('student的名字' + student.name);    
    </script>
</body>
</html>
