<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏集 · 字体图标底导航</title>
<link rel="stylesheet" href="font/iconfont.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== zyt 设计 token — 「藏集」东方藏物市集 ===== */
  :root {
    --zyt-bg: #101C14;        /* 墨绿夜色 */
    --zyt-panel: #16281C;     /* 深苔 */
    --zyt-paper: #F5F1E8;     /* 宣纸 */
    --zyt-ink: #1B2B20;       /* 墨绿黑 */
    --zyt-muted: #7A8B7E;     /* 灰苔 */
    --zyt-accent: #3E7C59;    /* 苔绿 */
    --zyt-badge: #D9382B;     /* 朱砂 */
    --zyt-gold: #C9A227;      /* 鎏金 */
    --zyt-line: rgba(245,241,232,0.14);
    --zyt-serif: 'Playfair Display', 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    --zyt-sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --zyt_device_w: 390px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--zyt-sans);
    background-color: var(--zyt-bg);
    color: var(--zyt-paper);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景大字水印 */
  .zyt_watermark {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: 46vmin;
    color: rgba(245, 241, 232, 0.028);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  .zyt_page {
    position: relative;
    z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 2rem 5rem;
  }

  /* —— 顶部导航 —— */
  .zyt_topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--zyt-line);
  }
  .zyt_back {
    font-size: 0.85rem;
    color: rgba(245,241,232,0.55);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: color 0.2s;
  }
  .zyt_back:hover { color: var(--zyt-gold); }
  .zyt_switch {
    font-size: 0.8rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--zyt-line);
    color: var(--zyt-paper);
    text-decoration: none;
    letter-spacing: 0.06em;
    transition: border-color 0.2s, color 0.2s;
  }
  .zyt_switch:hover { border-color: var(--zyt-gold); color: var(--zyt-gold); }

  /* —— 头部 —— */
  .zyt_header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2rem;
    padding: 3.5rem 0 2.5rem;
    flex-wrap: wrap;
  }
  .zyt_brand_cn {
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: clamp(2.6rem, 5vw, 4.2rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.08em;
  }
  .zyt_brand_cn em {
    font-style: normal;
    color: var(--zyt-gold);
  }
  .zyt_brand_en {
    font-family: var(--zyt-serif);
    font-style: italic;
    font-size: 1rem;
    color: rgba(245,241,232,0.5);
    margin-top: 0.9rem;
    letter-spacing: 0.06em;
  }
  .zyt_header_note {
    max-width: 300px;
    font-size: 0.88rem;
    line-height: 1.8;
    color: rgba(245,241,232,0.55);
    border-left: 2px solid var(--zyt-accent);
    padding-left: 1.1rem;
  }
  .zyt_header_note code {
    font-family: var(--zyt-serif);
    color: var(--zyt-gold);
    font-size: 0.82rem;
  }

  /* —— 控制器：设备宽度切换 —— */
  .zyt_controls {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }
  .zyt_control_label {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    color: rgba(245,241,232,0.45);
  }
  .zyt_seg {
    display: flex;
    border: 1px solid var(--zyt-line);
  }
  .zyt_seg_btn {
    font-family: var(--zyt-sans);
    font-size: 0.78rem;
    padding: 0.55rem 1.1rem;
    background: transparent;
    border: none;
    color: rgba(245,241,232,0.55);
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }
  .zyt_seg_btn + .zyt_seg_btn { border-left: 1px solid var(--zyt-line); }
  .zyt_seg_btn.zyt_active { background: var(--zyt-paper); color: var(--zyt-ink); }
  .zyt_reset {
    font-size: 0.78rem;
    background: none;
    border: none;
    color: var(--zyt-gold);
    cursor: pointer;
    letter-spacing: 0.06em;
    border-bottom: 1px solid transparent;
    padding: 0;
    transition: border-color 0.2s;
  }
  .zyt_reset:hover { border-color: var(--zyt-gold); }

  /* ===== 手机模型 ===== */
  .zyt_stage {
    display: flex;
    justify-content: center;
  }
  .zyt_phone {
    width: min(var(--zyt_device_w), 92vw);
    height: min(760px, 84vh);
    min-height: 560px;
    background: #0A0F0B;
    border-radius: 46px;
    padding: 12px;
    box-shadow:
      0 0 0 1px rgba(245,241,232,0.08),
      0 40px 90px rgba(0,0,0,0.55),
      0 12px 30px rgba(0,0,0,0.4);
    transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
  }
  .zyt_screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--zyt-paper);
    border-radius: 36px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--zyt-ink);
  }
  /* 刘海 */
  .zyt_notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 34%;
    height: 24px;
    background: #0A0F0B;
    border-radius: 14px;
    z-index: 30;
  }

  /* 状态栏 */
  .zyt_statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 26px 6px;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--zyt-ink);
    flex-shrink: 0;
    z-index: 20;
  }
  .zyt_status_icons {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .zyt_sig { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; }
  .zyt_sig i { width: 2.5px; background: var(--zyt-ink); border-radius: 1px; display: block; }
  .zyt_sig i:nth-child(1) { height: 3px; }
  .zyt_sig i:nth-child(2) { height: 5px; }
  .zyt_sig i:nth-child(3) { height: 7px; }
  .zyt_sig i:nth-child(4) { height: 9px; }
  .zyt_batt {
    width: 20px; height: 10px;
    border: 1.5px solid var(--zyt-ink);
    border-radius: 3px;
    position: relative;
  }
  .zyt_batt::before {
    content: '';
    position: absolute;
    inset: 1.5px;
    right: 30%;
    background: var(--zyt-ink);
    border-radius: 1px;
  }

  /* App 头部 */
  .zyt_appbar {
    padding: 10px 22px 14px;
    flex-shrink: 0;
    z-index: 20;
    background: var(--zyt-paper);
  }
  .zyt_appbar_brand {
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--zyt-ink);
  }
  .zyt_appbar_sub {
    font-size: 0.72rem;
    color: var(--zyt-muted);
    letter-spacing: 0.22em;
    margin-top: 2px;
  }

  /* 内容流 */
  .zyt_feed {
    flex: 1;
    overflow-y: auto;
    padding: 4px 18px 24px;
    scrollbar-width: none;
  }
  .zyt_feed::-webkit-scrollbar { display: none; }

  .zyt_section_title {
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    color: var(--zyt-muted);
    margin: 18px 4px 12px;
  }

  .zyt_item {
    display: flex;
    gap: 14px;
    background: #FFFFFF;
    border: 1px solid rgba(27,43,32,0.07);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    align-items: center;
  }
  .zyt_item_thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: 1.6rem;
    color: var(--zyt-paper);
  }
  .zyt_item_info { flex: 1; min-width: 0; }
  .zyt_item_name {
    font-family: 'Songti SC', 'Noto Serif SC', 'SimSun', serif;
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--zyt-ink);
  }
  .zyt_item_desc {
    font-size: 0.74rem;
    color: var(--zyt-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zyt_item_price {
    font-family: var(--zyt-serif);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--zyt-accent);
    margin-top: 5px;
  }
  .zyt_item_acts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }
  .zyt_act_btn {
    background: none;
    border: none;
    padding: 2px;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    color: #B9C4BB;
    transition: transform 0.15s, color 0.2s;
  }
  .zyt_act_btn:active { transform: scale(1.25); }
  .zyt_act_btn.zyt_on { color: inherit; } /* 填充态自带彩色 */

  /* ===== 底部固定导航（核心组件） ===== */
  .zyt_tabbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(27,43,32,0.08);
    padding: 8px 6px calc(10px + env(safe-area-inset-bottom, 0px));
    z-index: 25;
  }
  .zyt_tab {
    flex: 1 1 0;           /* 自适应均分宽度 */
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0 2px;
    color: #98A69B;
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .zyt_tab.zyt_active { color: var(--zyt-ink); }
  .zyt_tab.zyt_active .zyt_tab_label { color: var(--zyt-accent); font-weight: 600; }

  .zyt_tab_iconwrap {
    position: relative;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zyt_tab_icon { font-size: 1.45rem; line-height: 1; }
  .zyt_tab.zyt_active .zyt_tab_iconwrap {
    animation: zyt_pop 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes zyt_pop {
    0% { transform: scale(0.82); }
    100% { transform: scale(1); }
  }

  .zyt_tab_label {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    color: inherit;
  }

  /* 数字徽章 */
  .zyt_badge {
    position: absolute;
    top: -5px;
    left: calc(50% + 6px);
    min-width: 17px;
    height: 17px;
    padding: 0 4.5px;
    background: var(--zyt-badge);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 600;
    font-family: var(--zyt-sans);
    line-height: 17px;
    text-align: center;
    border-radius: 9px;
    border: 1.5px solid #fff;
    box-shadow: 0 2px 6px rgba(217, 56, 43, 0.4);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
  }
  /* 红点 */
  .zyt_dot {
    position: absolute;
    top: -2px;
    left: calc(50% + 8px);
    width: 9px;
    height: 9px;
    background: var(--zyt-badge);
    border-radius: 50%;
    border: 1.5px solid #fff;
    box-shadow: 0 1px 4px rgba(217, 56, 43, 0.45);
    transition: transform 0.25s, opacity 0.2s;
    pointer-events: none;
  }
  .zyt_badge.zyt_hide, .zyt_dot.zyt_hide {
    transform: scale(0);
    opacity: 0;
  }

  /* Home 指示条 */
  .zyt_homebar {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 32%;
    height: 4px;
    background: rgba(27,43,32,0.25);
    border-radius: 2px;
    z-index: 26;
    pointer-events: none;
  }

  /* —— 页脚 —— */
  .zyt_footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--zyt-line);
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: rgba(245,241,232,0.4);
    letter-spacing: 0.1em;
    flex-wrap: wrap;
    gap: 1rem;
  }

  @media (max-width: 640px) {
    .zyt_page { padding: 0 1rem 3rem; }
    .zyt_header { padding: 2rem 0 1.5rem; }
    .zyt_phone { padding: 8px; border-radius: 38px; }
    .zyt_screen { border-radius: 30px; }
  }
</style>
</head>
<body>

<div class="zyt_watermark">藏</div>

<div class="zyt_page">

  <nav class="zyt_topbar">
    <a href="index.html" class="zyt_back">← 返回首页</a>
    <a href="iconfont-4.html" class="zyt_switch">SVG 版 →</a>
  </nav>

  <header class="zyt_header">
    <div>
      <h1 class="zyt_brand_cn">藏<em>集</em></h1>
      <p class="zyt_brand_en">Collecta — 移动端底导航 · 字体图标实现</p>
    </div>
    <p class="zyt_header_note">
      导航四项取自 iconfont 字体库，以 <code>@font-face</code> 载入，激活态切换至 <code>-copy</code> 填充字形；徽章为纯 CSS 数字角标与红点。
    </p>
  </header>

  <div class="zyt_controls">
    <span class="zyt_control_label">设备宽度 · 导航自适应</span>
    <div class="zyt_seg" id="zyt_seg">
      <button class="zyt_seg_btn" data-w="340px">紧凑 340</button>
      <button class="zyt_seg_btn zyt_active" data-w="390px">标准 390</button>
      <button class="zyt_seg_btn" data-w="440px">宽屏 440</button>
    </div>
    <button class="zyt_reset" id="zyt_reset">重置徽章</button>
  </div>

  <div class="zyt_stage">
    <div class="zyt_phone" id="zyt_phone">
      <div class="zyt_screen">
        <div class="zyt_notch"></div>

        <!-- 状态栏 -->
        <div class="zyt_statusbar">
          <span id="zyt_clock">9:41</span>
          <div class="zyt_status_icons">
            <span class="zyt_sig"><i></i><i></i><i></i><i></i></span>
            <span class="zyt_batt"></span>
          </div>
        </div>

        <!-- App 头部 -->
        <div class="zyt_appbar">
          <div class="zyt_appbar_brand" id="zyt_appbar_title">藏集</div>
          <div class="zyt_appbar_sub" id="zyt_appbar_sub">东方藏物 · 每日上新</div>
        </div>

        <!-- 内容 -->
        <div class="zyt_feed" id="zyt_feed">
          <p class="zyt_section_title">今日甄选</p>
          <!-- JS 生成器物卡片 -->
        </div>

        <!-- 底部固定导航 -->
        <nav class="zyt_tabbar" id="zyt_tabbar"><!-- JS 生成 --></nav>
        <div class="zyt_homebar"></div>
      </div>
    </div>
  </div>

  <footer class="zyt_footer">
    <span>ICONFONT · FONT-CLASS 方案</span>
    <span>藏集 COLLECTA © 2026</span>
  </footer>

</div>

<script>
/* ===== zyt 数据 ===== */
var zyt_tabs = [
  { key: 'home',  label: '首页', icon: 'icon-shouye1',   iconOn: 'icon-shouye1',      badge: null,  title: '藏集',   sub: '东方藏物 · 每日上新' },
  { key: 'like',  label: '喜欢', icon: 'icon-xihuan2',   iconOn: 'icon-xihuan2-copy', badge: '3',   title: '喜欢',   sub: '心仪之物 · 念念不忘' },
  { key: 'fav',   label: '收藏', icon: 'icon-shoucang2', iconOn: 'icon-shoucang2-copy', badge: '99+', title: '收藏', sub: '入库雅藏 · 时时摩挲' },
  { key: 'mine',  label: '我的', icon: 'icon-wode',      iconOn: 'icon-wode',          badge: 'dot', title: '我的',   sub: '藏主名册 · 往来记录' }
];

var zyt_goods = [
  { name: '汝窑天青盏', desc: '北宋摹古 · 玛瑙入釉', price: '¥1,280', glyph: '盏', hue: '#3E7C59' },
  { name: '剔红漆器盒', desc: '明代雕漆 · 云纹盖盒', price: '¥3,600', glyph: '漆', hue: '#8C3B2E' },
  { name: '青花缠枝瓶', desc: '康熙民窑 · 缠枝莲纹', price: '¥5,200', glyph: '瓷', hue: '#2E4E8C' },
  { name: '竹刻臂搁',   desc: '嘉定派 · 留青山水',   price: '¥860',   glyph: '竹', hue: '#6B5B2E' },
  { name: '铜鎏金香炉', desc: '宣德炉式 · 螭龙耳',   price: '¥2,400', glyph: '炉', hue: '#7A4A21' }
];

/* ===== zyt 状态 ===== */
var zyt_active = 'home';

/* ===== zyt 渲染底导航 ===== */
var zyt_tabbar = document.getElementById('zyt_tabbar');

function zyt_renderTabbar() {
  zyt_tabbar.innerHTML = '';
  zyt_tabs.forEach(function(zyt_t) {
    var zyt_btn = document.createElement('button');
    zyt_btn.className = 'zyt_tab' + (zyt_t.key === zyt_active ? ' zyt_active' : '');
    zyt_btn.dataset.key = zyt_t.key;

    var zyt_badgeHtml = '';
    if (zyt_t.badge === 'dot') {
      zyt_badgeHtml = '<span class="zyt_dot" data-badge="' + zyt_t.key + '"></span>';
    } else if (zyt_t.badge) {
      zyt_badgeHtml = '<span class="zyt_badge" data-badge="' + zyt_t.key + '">' + zyt_t.badge + '</span>';
    }

    zyt_btn.innerHTML =
      '<span class="zyt_tab_iconwrap">' +
        '<i class="iconfont zyt_tab_icon ' + (zyt_t.key === zyt_active ? zyt_t.iconOn : zyt_t.icon) + '"></i>' +
        zyt_badgeHtml +
      '</span>' +
      '<span class="zyt_tab_label">' + zyt_t.label + '</span>';

    zyt_btn.addEventListener('click', function() { zyt_selectTab(zyt_t.key); });
    zyt_tabbar.appendChild(zyt_btn);
  });
}

function zyt_selectTab(zyt_key) {
  zyt_active = zyt_key;
  var zyt_t = zyt_tabs.find(function(x) { return x.key === zyt_key; });
  document.getElementById('zyt_appbar_title').textContent = zyt_t.title;
  document.getElementById('zyt_appbar_sub').textContent = zyt_t.sub;
  // 清除该项徽章
  var zyt_b = document.querySelector('[data-badge="' + zyt_key + '"]');
  if (zyt_b) {
    zyt_b.classList.add('zyt_hide');
    setTimeout(function() { if (zyt_b.parentNode) zyt_b.parentNode.removeChild(zyt_b); }, 260);
    zyt_t.badge = null;
  }
  zyt_renderTabbar();
}

/* ===== zyt 渲染器物卡片 ===== */
var zyt_feed = document.getElementById('zyt_feed');
var zyt_section = zyt_feed.querySelector('.zyt_section_title');

zyt_goods.forEach(function(zyt_g) {
  var zyt_card = document.createElement('div');
  zyt_card.className = 'zyt_item';
  zyt_card.innerHTML =
    '<div class="zyt_item_thumb" style="background:' + zyt_g.hue + '">' + zyt_g.glyph + '</div>' +
    '<div class="zyt_item_info">' +
      '<div class="zyt_item_name">' + zyt_g.name + '</div>' +
      '<div class="zyt_item_desc">' + zyt_g.desc + '</div>' +
      '<div class="zyt_item_price">' + zyt_g.price + '</div>' +
    '</div>' +
    '<div class="zyt_item_acts">' +
      '<button class="zyt_act_btn" data-act="like" title="喜欢"><i class="iconfont icon-xihuan2"></i></button>' +
      '<button class="zyt_act_btn" data-act="fav" title="收藏"><i class="iconfont icon-shoucang2"></i></button>' +
    '</div>';
  zyt_feed.appendChild(zyt_card);
});

/* 卡片内喜欢/收藏切换：切换 -copy 彩色填充字形 */
zyt_feed.addEventListener('click', function(zyt_e) {
  var zyt_btn = zyt_e.target.closest('.zyt_act_btn');
  if (!zyt_btn) return;
  var zyt_i = zyt_btn.querySelector('i');
  var zyt_on = zyt_btn.classList.toggle('zyt_on');
  if (zyt_btn.dataset.act === 'like') {
    zyt_i.className = 'iconfont ' + (zyt_on ? 'icon-xihuan2-copy' : 'icon-xihuan2');
  } else {
    zyt_i.className = 'iconfont ' + (zyt_on ? 'icon-shoucang2-copy' : 'icon-shoucang2');
  }
});

/* ===== zyt 设备宽度切换 ===== */
document.getElementById('zyt_seg').addEventListener('click', function(zyt_e) {
  var zyt_btn = zyt_e.target.closest('.zyt_seg_btn');
  if (!zyt_btn) return;
  document.querySelectorAll('.zyt_seg_btn').forEach(function(b) { b.classList.remove('zyt_active'); });
  zyt_btn.classList.add('zyt_active');
  document.documentElement.style.setProperty('--zyt_device_w', zyt_btn.dataset.w);
});

/* ===== zyt 重置徽章 ===== */
var zyt_badgeDefaults = { like: '3', fav: '99+', mine: 'dot' };
document.getElementById('zyt_reset').addEventListener('click', function() {
  zyt_tabs.forEach(function(t) { t.badge = zyt_badgeDefaults[t.key] || null; });
  zyt_renderTabbar();
});

/* ===== 启动 ===== */
zyt_renderTabbar();
</script>
</body>
</html>
