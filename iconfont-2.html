<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>现代装置 · Lucide SVG 图标</title>
<script src="cdn/lucide/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== zyt 设计 token — 现代装置 ===== */
  :root {
    --zyt-bg: #F8F8F6;       /* 冷调近白 */
    --zyt-ink: #111418;      /* 蓝调近黑 */
    --zyt-muted: #6B7280;    /* 中性灰 */
    --zyt-border: #E5E7EB;   /* 边框 */
    --zyt-card: #FFFFFF;     /* 卡片 */
    --zyt-accent: #3A6FF8;   /* 冷蓝 */
    --zyt-accent-soft: #93B5FC;
    --zyt-grotesk: 'Space Grotesk', -apple-system, sans-serif;
    --zyt-sans: 'Inter', -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--zyt-sans);
    background-color: var(--zyt-bg);
    color: var(--zyt-ink);
    line-height: 1.6;
    min-height: 100vh;
  }

  .zyt_container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  /* —— 顶部导航 —— */
  .zyt_topbar {
    padding: 1.5rem 0;
    margin-bottom: 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--zyt-border);
  }
  .zyt_topbar_left {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }
  .zyt_back {
    font-family: var(--zyt-grotesk);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--zyt-muted);
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: color 0.2s;
  }
  .zyt_back:hover { color: var(--zyt-accent); }
  .zyt_back svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 0.4rem; }
  .zyt_crumb {
    font-size: 0.8rem;
    color: var(--zyt-muted);
    font-family: var(--zyt-grotesk);
  }
  .zyt_nav_links {
    display: flex;
    gap: 1rem;
  }
  .zyt_nav_links a {
    font-family: var(--zyt-grotesk);
    font-size: 0.8rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--zyt-border);
    color: var(--zyt-ink);
    text-decoration: none;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }
  .zyt_nav_links a:hover {
    border-color: var(--zyt-accent);
    color: var(--zyt-accent);
  }

  /* —— 头部 —— */
  .zyt_header {
    margin-bottom: 2.5rem;
  }
  .zyt_eyebrow {
    font-family: var(--zyt-grotesk);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--zyt-muted);
    margin-bottom: 1rem;
  }
  .zyt_title {
    font-family: var(--zyt-grotesk);
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }
  .zyt_title .zyt_accent {
    color: var(--zyt-accent);
  }
  .zyt_intro {
    font-size: 1.05rem;
    color: var(--zyt-muted);
    max-width: 580px;
    font-family: var(--zyt-sans);
  }

  /* —— 控制面板 —— */
  .zyt_controls {
    display: flex;
    align-items: center;
    gap: 2rem;
    padding: 1.25rem 0;
    margin-bottom: 2rem;
    border-top: 1px solid var(--zyt-border);
    border-bottom: 1px solid var(--zyt-border);
    flex-wrap: wrap;
  }
  .zyt_control_group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .zyt_control_label {
    font-family: var(--zyt-grotesk);
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--zyt-muted);
    letter-spacing: 0.1em;
  }
  .zyt_btns {
    display: flex;
    gap: 0.35rem;
  }
  .zyt_btn {
    font-family: var(--zyt-grotesk);
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.4rem 0.85rem;
    background: transparent;
    border: 1px solid var(--zyt-border);
    color: var(--zyt-muted);
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
  }
  .zyt_btn:hover { color: var(--zyt-ink); }
  .zyt_btn.zyt_active {
    background: var(--zyt-ink);
    border-color: var(--zyt-ink);
    color: var(--zyt-bg);
  }

  /* —— 颜色选择器 —— */
  .zyt_colors {
    display: flex;
    gap: 0.5rem;
    margin-left: auto;
  }
  .zyt_color_dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    padding: 0;
  }
  .zyt_color_dot:hover { transform: scale(1.15); }
  .zyt_color_dot.zyt_active {
    border-color: var(--zyt-ink);
    transform: scale(1.1);
  }

  /* —— 图标网格 —— */
  .zyt_grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 1rem;
    margin-bottom: 3rem;
  }
  .zyt_icon_card {
    background: var(--zyt-card);
    border: 1px solid var(--zyt-border);
    padding: 1.75rem 1rem 1.25rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
    position: relative;
  }
  .zyt_icon_card:hover {
    border-color: var(--zyt-accent);
    box-shadow: 0 4px 24px rgba(58, 111, 248, 0.1);
    transform: translateY(-2px);
  }

  .zyt_icon_display {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 52px;
    margin-bottom: 0.85rem;
  }
  .zyt_icon_display svg {
    width: 38px;
    height: 38px;
    stroke-width: 1.75;
    stroke: var(--zyt-current-color, var(--zyt-ink));
    fill: none;
  }

  .zyt_icon_name {
    font-family: var(--zyt-grotesk);
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
    color: var(--zyt-ink);
  }
  .zyt_icon_key {
    font-family: var(--zyt-grotesk);
    font-size: 0.65rem;
    color: var(--zyt-muted);
    letter-spacing: 0.02em;
  }
  .zyt_copy_badge {
    position: absolute;
    top: 0.65rem;
    right: 0.65rem;
    font-family: var(--zyt-grotesk);
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--zyt-accent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .zyt_icon_card:hover .zyt_copy_badge { opacity: 1; }

  /* —— 提示条 —— */
  .zyt_toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--zyt-ink);
    color: var(--zyt-bg);
    font-family: var(--zyt-grotesk);
    font-size: 0.8rem;
    padding: 0.75rem 1.5rem;
    letter-spacing: 0.04em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
  }
  .zyt_toast.zyt_show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* —— 页脚 —— */
  .zyt_footer {
    text-align: center;
    padding: 2.5rem 0;
    border-top: 1px solid var(--zyt-border);
    font-size: 0.78rem;
    color: var(--zyt-muted);
    font-family: var(--zyt-grotesk);
    letter-spacing: 0.08em;
  }

  @media (max-width: 600px) {
    .zyt_container { padding: 0 1rem; }
    .zyt_topbar { flex-direction: column; align-items: flex-start; gap: 1rem; }
    .zyt_controls { gap: 1rem; }
    .zyt_colors { margin-left: 0; }
    .zyt_grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.75rem; }
  }
</style>
</head>
<body>

<div class="zyt_container">

  <!-- 顶部导航 -->
  <nav class="zyt_topbar">
    <div class="zyt_topbar_left">
      <a href="index.html" class="zyt_back">← 返回首页</a>
      <span class="zyt_crumb">/ II. Lucide</span>
    </div>
    <div class="zyt_nav_links">
      <a href="iconfont-1.html">Font Awesome →</a>
    </div>
  </nav>

  <!-- 头部 -->
  <header class="zyt_header">
    <p class="zyt_eyebrow">— INSTALLATION 02 —</p>
    <h1 class="zyt_title"><span class="zyt_accent">SVG</span> 的<br>精度之美</h1>
    <p class="zyt_intro">Lucide 提供一套线性风格的开源 SVG 图标。每一个都是矢量路径，描边、颜色、尺寸均可自由调整 — 真正意义上的像素级控制。</p>
  </header>

  <!-- 控制面板 -->
  <section class="zyt_controls" id="zyt_controls">
    <div class="zyt_control_group">
      <span class="zyt_control_label">STROKE</span>
      <div class="zyt_btns" id="zyt_stroke_btns">
        <button class="zyt_btn" data-stroke="1">1</button>
        <button class="zyt_btn" data-stroke="1.5">1.5</button>
        <button class="zyt_btn zyt_active" data-stroke="1.75">1.75</button>
        <button class="zyt_btn" data-stroke="2">2</button>
        <button class="zyt_btn" data-stroke="2.5">2.5</button>
      </div>
    </div>

    <div class="zyt_control_group">
      <span class="zyt_control_label">SIZE</span>
      <div class="zyt_btns" id="zyt_size_btns">
        <button class="zyt_btn" data-size="28">S</button>
        <button class="zyt_btn zyt_active" data-size="38">M</button>
        <button class="zyt_btn" data-size="52">L</button>
      </div>
    </div>

    <div class="zyt_colors" id="zyt_colors">
      <button class="zyt_color_dot zyt_active" style="background:#111418" data-color="#111418"></button>
      <button class="zyt_color_dot" style="background:#3A6FF8" data-color="#3A6FF8"></button>
      <button class="zyt_color_dot" style="background:#10B981" data-color="#10B981"></button>
      <button class="zyt_color_dot" style="background:#EF4444" data-color="#EF4444"></button>
      <button class="zyt_color_dot" style="background:#6B7280" data-color="#6B7280"></button>
    </div>
  </section>

  <!-- 图标网格 -->
  <main class="zyt_grid" id="zyt_grid">
    <!-- JS 生成 -->
  </main>

  <footer class="zyt_footer">
    LUCIDE · OPEN SOURCE · VIA SVG
  </footer>

</div>

<div class="zyt_toast" id="zyt_toast">已复制 SVG 片段</div>

<script>
/* ===== zyt 图标数据 — Lucide ===== */
var zyt_iconList = [
  { id: 'palette', label: '调色板' },
  { id: 'brush', label: '画笔' },
  { id: 'feather', label: '羽毛' },
  { id: 'moon', label: '月亮' },
  { id: 'sun', label: '太阳' },
  { id: 'star', label: '星辰' },
  { id: 'crown', label: '王冠' },
  { id: 'gem', label: '宝石' },
  { id: 'camera', label: '相机' },
  { id: 'film', label: '胶片' },
  { id: 'music', label: '乐谱' },
  { id: 'book', label: '书' },
  { id: 'scroll', label: '卷轴' },
  { id: 'mountain', label: '山峰' },
  { id: 'flame', label: '火焰' },
  { id: 'wine', label: '酒杯' },
  { id: 'coffee', label: '咖啡' },
  { id: 'leaf', label: '叶片' },
  { id: 'cloud', label: '云' },
  { id: 'wind', label: '风' },
  { id: 'droplet', label: '水滴' },
  { id: 'zap', label: '闪电' },
  { id: 'atom', label: '原子' },
  { id: 'flask-conical', label: '烧瓶' },
  { id: 'key', label: '钥匙' },
  { id: 'lock', label: '锁' },
  { id: 'heart', label: '心' },
  { id: 'compass', label: '罗盘' },
  { id: 'sparkles', label: '闪光' },
  { id: 'award', label: '奖章' },
  { id: 'gift', label: '礼物' },
  { id: 'umbrella', label: '伞' },
  { id: 'anchor', label: '锚' },
  { id: 'bell', label: '铃' },
  { id: 'box', label: '盒子' },
  { id: 'layers', label: '图层' },
  { id: 'layout', label: '布局' },
  { id: 'monitor', label: '屏幕' },
  { id: 'smartphone', label: '手机' },
  { id: 'tablet', label: '平板' },
  { id: 'tv', label: '电视' },
  { id: 'headphones', label: '耳机' },
  { id: 'speaker', label: '音箱' },
  { id: 'disc', label: '光盘' },
  { id: 'rss', label: '订阅' },
  { id: 'mail', label: '邮件' },
  { id: 'send', label: '发送' },
  { id: 'archive', label: '归档' },
  { id: 'file-text', label: '文件' },
  { id: 'image', label: '图像' },
  { id: 'video', label: '视频' },
  { id: 'mic', label: '麦克风' }
];

/* ===== zyt 状态 ===== */
var zyt_state = {
  stroke: 1.75,
  size: 38,
  color: '#111418'
};

/* ===== zyt 渲染 ===== */
var zyt_grid = document.getElementById('zyt_grid');

function zyt_render() {
  zyt_grid.innerHTML = '';
  zyt_iconList.forEach(function(zyt_item) {
    var zyt_card = document.createElement('div');
    zyt_card.className = 'zyt_icon_card';
    zyt_card.dataset.id = zyt_item.id;
    zyt_card.innerHTML =
      '<span class="zyt_copy_badge">COPY</span>' +
      '<div class="zyt_icon_display">' +
        '<i data-lucide="' + zyt_item.id + '" data-stroke-width="' + zyt_state.stroke + '" style="width:' + zyt_state.size + 'px;height:' + zyt_state.size + 'px;"></i>' +
      '</div>' +
      '<div class="zyt_icon_name">' + zyt_item.label + '</div>' +
      '<div class="zyt_icon_key">' + zyt_item.id + '</div>';
    zyt_card.addEventListener('click', function() { zyt_copyIcon(zyt_item.id); });
    zyt_grid.appendChild(zyt_card);
  });
  // 触发 lucide 初始化
  if (window.lucide && window.lucide.createIcons) {
    window.lucide.createIcons();
    // 初始化后给 SVG 设置 stroke 颜色
    setTimeout(function() {
      document.querySelectorAll('#zyt_grid svg').forEach(function(svg) {
        svg.setAttribute('stroke', zyt_state.color);
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
      });
    }, 30);
  }
}

/* ===== zyt 参数刷新（不重建 DOM） ===== */
function zyt_applyParams() {
  document.querySelectorAll('#zyt_grid svg').forEach(function(svg) {
    svg.setAttribute('stroke-width', zyt_state.stroke);
    svg.setAttribute('stroke', zyt_state.color);
    svg.style.width = zyt_state.size + 'px';
    svg.style.height = zyt_state.size + 'px';
  });
}

/* ===== zyt 复制 ===== */
function zyt_copyIcon(zyt_id) {
  var zyt_fragment = '<i data-lucide="' + zyt_id + '" data-stroke-width="' + zyt_state.stroke + '"></i>';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(zyt_fragment);
  } else {
    var zyt_ta = document.createElement('textarea');
    zyt_ta.value = zyt_fragment;
    document.body.appendChild(zyt_ta);
    zyt_ta.select();
    document.execCommand('copy');
    document.body.removeChild(zyt_ta);
  }
  zyt_showToast();
}

var zyt_toastTimer = null;
function zyt_showToast() {
  var zyt_toast = document.getElementById('zyt_toast');
  zyt_toast.classList.add('zyt_show');
  clearTimeout(zyt_toastTimer);
  zyt_toastTimer = setTimeout(function() {
    zyt_toast.classList.remove('zyt_show');
  }, 1500);
}

/* ===== zyt 控制面板交互 ===== */
document.getElementById('zyt_stroke_btns').addEventListener('click', function(zyt_e) {
  var zyt_btn = zyt_e.target.closest('.zyt_btn');
  if (!zyt_btn) return;
  document.querySelectorAll('#zyt_stroke_btns .zyt_btn').forEach(function(b) { b.classList.remove('zyt_active'); });
  zyt_btn.classList.add('zyt_active');
  zyt_state.stroke = parseFloat(zyt_btn.dataset.stroke);
  zyt_applyParams();
});

document.getElementById('zyt_size_btns').addEventListener('click', function(zyt_e) {
  var zyt_btn = zyt_e.target.closest('.zyt_btn');
  if (!zyt_btn) return;
  document.querySelectorAll('#zyt_size_btns .zyt_btn').forEach(function(b) { b.classList.remove('zyt_active'); });
  zyt_btn.classList.add('zyt_active');
  zyt_state.size = parseInt(zyt_btn.dataset.size);
  zyt_applyParams();
});

document.getElementById('zyt_colors').addEventListener('click', function(zyt_e) {
  var zyt_btn = zyt_e.target.closest('.zyt_color_dot');
  if (!zyt_btn) return;
  document.querySelectorAll('#zyt_colors .zyt_color_dot').forEach(function(b) { b.classList.remove('zyt_active'); });
  zyt_btn.classList.add('zyt_active');
  zyt_state.color = zyt_btn.dataset.color;
  document.documentElement.style.setProperty('--zyt-current-color', zyt_state.color);
  zyt_applyParams();
});

/* ===== 启动 ===== */
zyt_render();
</script>
</body>
</html>
